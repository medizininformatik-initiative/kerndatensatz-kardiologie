# Adopted from MII PRO Module minimal rule file
#
# Prefix-Kuerzel (id: klein, name/title: gross):
#   pr  = Profil (StructureDefinition)        ex  = Extension
#   lm  = Logical Model                        vs  = ValueSet
#   cs  = CodeSystem                           cm  = ConceptMap
#   sm  = StructureMap                         ns  = NamingSystem
#   sp  = SearchParameter                      cps = CapabilityStatement
#   od  = OperationDefinition                  qst = Questionnaire
#   lib = Library                              exa = Beispiel (Example)
#   Nur fuer ids (Ressourcen ohne name/title in R4):
#   obsdef = ObservationDefinition             param = Parameters
#
# Die ImplementationGuide-Ressource ist von den Namenskonventionen (id, name, title)
# ausgenommen, da sie dem modulweiten Schema (mii-kerndatensatzmodul-kardiologie) folgt.
# Geprueft wird jeweils nur der Prefix; der individuelle Ressourcenname folgt danach.

- action: parse
  name: parse-fhir-resources
  status: "Checking if all FHIR Resource files can be parsed"
  files:
    - /**/*.xml
    - /**/*.json
    - "!package.json"
    - "!fhirpkg.lock.json"

- name: resource-validation
  status: "Validating resources against the FHIR standard and their profiles"
  action: validate
  category: Resource
  suppress:
    - 6005
    - eld-16

- name: version-filled
  # NamingSystem ist ausgenommen, da es in R4 kein version-Element hat
  filter: (StructureDefinition or ValueSet or CodeSystem or ConceptMap or StructureMap or SearchParameter or CapabilityStatement or OperationDefinition or Questionnaire or Library or ImplementationGuide).exists()
  status: "Checking if all resources have version filled"
  predicate: version.exists() and (version in ('2027.0.0-ballot', '2027.0.0-ballot.rc1', '2027.0.0-rc.1', '2027.0.0-rc.2', '2027.0.0-rc.3', '2027.0.0-rc.4', '2027.0.0', '2027.0.1', '2027.1.0', '2027.2.0', '2027.3.0', '2027.4.0', '2027.4.1', '2027.5.0', '2027.5.1', '2027.5.2-rc.1', '2027.5.2'))
  error-message: "version not filled (correctly)"
  files:
    - /**/*.xml
    - /**/*.json
    - "!package.json"

- name: valid-id
  # See https://github.com/FirelyTeam/firely-net-sdk/issues/1773
  status: "Checking if all resource ids are valid"
  predicate: id.matches('^[A-Za-z0-9\\-\\.]{1,64}$')
  error-message: "The resource must have a valid id"
  files:
    - /**/*.xml
    - /**/*.json
    - "!package.json"

- name: naming-convention-id
  filter: ImplementationGuide.exists().not()
  status: "Checking if all resource ids follow the naming convention"
  predicate: id.matches('^mii-(pr|ex|lm|vs|cs|cm|sm|ns|sp|cps|od|qst|lib|exa|obsdef|param)-kardio')
  error-message: "resource id naming convention mismatch"
  files:
    - /**/*.xml
    - /**/*.json
    - "!package.json"

- name: naming-convention-name
  filter: (StructureDefinition or ValueSet or CodeSystem or ConceptMap or StructureMap or NamingSystem or SearchParameter or CapabilityStatement or OperationDefinition or Questionnaire or Library).exists()
  status: "Checking if all resource names follow the naming convention"
  predicate: name.exists() implies name.matches('^MII_(PR|EX|LM|VS|CS|CM|SM|NS|SP|CPS|OD|QST|LIB|EXA)_Kardio')
  error-message: "resource name naming convention mismatch"
  files:
    - /**/*.xml
    - /**/*.json
    - "!package.json"

- name: naming-convention-title
  filter: (StructureDefinition or ValueSet or CodeSystem or ConceptMap or StructureMap or NamingSystem or SearchParameter or CapabilityStatement or OperationDefinition or Questionnaire or Library).exists()
  status: "Checking if all resource titles follow the naming convention"
  predicate: title.exists() implies title.matches('^MII (PR|EX|LM|VS|CS|CM|SM|NS|SP|CPS|OD|QST|LIB|EXA) Kardio')
  error-message: "resource title naming convention mismatch"
  files:
    - /**/*.xml
    - /**/*.json
    - "!package.json"

- name: naming-convention-url
  filter: (StructureDefinition or ValueSet or CodeSystem or ConceptMap or StructureMap or NamingSystem or SearchParameter or CapabilityStatement or OperationDefinition or Questionnaire or Library or ImplementationGuide).exists()
  status: "Checking if all resource urls follow the naming convention"
  predicate: url.exists() implies url.matches('^https://www.medizininformatik-initiative.de/fhir/ext/modul-kardio/')
  error-message: "resource url naming convention mismatch"
  files:
    - /**/*.xml
    - /**/*.json
    - "!package.json"
